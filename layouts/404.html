{{ define "main" }}
<div style="display: flex; justify-content: center; align-items: center; min-height: 60vh; padding: 2rem;">
  <div style="text-align: center; max-width: 480px;">
    <h1 style="font-size: 6rem; font-weight: 700; color: var(--accent); margin: 0; line-height: 1;">404</h1>
    <p style="font-size: 1.25rem; color: var(--text-secondary); margin: 1rem 0 2rem;">Page not found.</p>
    <a href="/" style="display: inline-block; padding: 0.75rem 1.5rem; background: var(--accent); color: #fff; border-radius: 0.5rem; text-decoration: none; font-weight: 600; transition: opacity 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">Back to Home</a>
  </div>
</div>
{{ end }}
