<!-- Mobile Navigation -->
<div class="mobile-nav-container">
  <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>
  
  <nav class="mobile-nav" id="mobile-nav">
    <a href="/about/" class="mobile-nav-link">About</a>
    <a href="/projects/" class="mobile-nav-link">Projects</a>
    <a href="/posts/" class="mobile-nav-link">Blog</a>
    <div class="mobile-nav-social">
      <a href="https://github.com/lrud" target="_blank" rel="noopener" class="mobile-social-link">GitHub</a>
      <a href="https://www.linkedin.com/in/lukas-r-15769637a" target="_blank" rel="noopener" class="mobile-social-link">LinkedIn</a>
      <a href="mailto:principlesOS@pm.me" class="mobile-social-link">Email</a>
    </div>
  </nav>
</div>

<style>
.mobile-nav-container {
  display: none;
}

.mobile-menu-toggle {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  width: 28px;
  height: 24px;
  padding: 0;
  border: none;
  background: transparent;
  cursor: pointer;
  z-index: 1001;
}

.hamburger-line {
  display: block;
  width: 100%;
  height: 3px;
  background-color: var(--text-primary);
  border-radius: 2px;
  transition: all 0.3s ease;
}

.mobile-menu-toggle.active .hamburger-line:nth-child(1) {
  transform: rotate(45deg) translate(6px, 6px);
}

.mobile-menu-toggle.active .hamburger-line:nth-child(2) {
  opacity: 0;
}

.mobile-menu-toggle.active .hamburger-line:nth-child(3) {
  transform: rotate(-45deg) translate(6px, -6px);
}

.mobile-nav {
  position: fixed;
  top: 0;
  right: -100%;
  width: 280px;
  height: 100vh;
  background-color: var(--bg-secondary);
  box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
  padding: 80px 30px 30px;
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.mobile-nav.active {
  right: 0;
}

.mobile-nav-link {
  display: block;
  padding: 1rem;
  color: var(--text-primary);
  text-decoration: none;
  font-size: 1.125rem;
  font-weight: 600;
  border-radius: 0.5rem;
  transition: all 0.2s ease;
}

.mobile-nav-link:hover {
  background-color: var(--accent);
  color: white;
}

.mobile-nav-social {
  margin-top: auto;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.mobile-social-link {
  display: block;
  padding: 0.75rem 1rem;
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 0.9375rem;
  transition: color 0.2s ease;
}

.mobile-social-link:hover {
  color: var(--accent);
}

.mobile-nav-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.5);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
}

.mobile-nav-overlay.active {
  opacity: 1;
  visibility: visible;
}

@media (max-width: 767px) {
  .mobile-nav-container {
    display: block;
  }
}
</style>

<script>
(function() {
  const toggle = document.getElementById('mobile-menu-toggle');
  const nav = document.getElementById('mobile-nav');
  
  let overlay = document.getElementById('mobile-nav-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'mobile-nav-overlay';
    overlay.className = 'mobile-nav-overlay';
    document.body.appendChild(overlay);
  }
  
  function toggleMenu() {
    toggle.classList.toggle('active');
    nav.classList.toggle('active');
    overlay.classList.toggle('active');
    document.body.style.overflow = nav.classList.contains('active') ? 'hidden' : '';
  }
  
  toggle.addEventListener('click', toggleMenu);
  overlay.addEventListener('click', toggleMenu);
  
  nav.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', function() {
      if (nav.classList.contains('active')) {
        toggleMenu();
      }
    });
  });
})();
</script>
