{{- $author := .Site.Params.author | default "Lukas Rueda" -}}
{{- $isPost := eq .Section "posts" -}}

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": {{ $author }},
  "url": {{ .Site.BaseURL }},
  "image": "{{ .Site.BaseURL }}images/headshot.jpg",
  "jobTitle": "Quantitative Economist & Risk Analyst",
  "description": {{ .Site.Params.description }},
  "email": "principlesOS@pm.me",
  "sameAs": [
    "https://github.com/lrud",
    "https://www.linkedin.com/in/lukas-r-15769637a"
  ],
  "alumniOf": [
    {
      "@type": "CollegeOrUniversity",
      "name": "Hunter College",
      "sameAs": "https://www.hunter.cuny.edu/"
    },
    {
      "@type": "CollegeOrUniversity",
      "name": "Skidmore College",
      "sameAs": "https://www.skidmore.edu/"
    }
  ],
  "knowsAbout": [
    "Econometrics",
    "Time-Series Analysis",
    "Financial Economics",
    "Volatility Modeling",
    "Risk Management",
    "Python",
    "Machine Learning"
  ]
}
</script>
{{- end }}

{{- if eq .RelPermalink "/about/" }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Economics Tutoring Services",
  "description": "Tutoring in Econometrics, Calculus, and Macroeconomics",
  "url": "https://www.wyzant.com/Tutors/LukasR",
  "provider": {
    "@type": "Person",
    "name": {{ $author }}
  },
  "serviceType": "Tutoring",
  "areaServed": {
    "@type": "Country",
    "name": "United States"
  },
  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Tutoring Subjects",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Econometrics Tutoring"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Calculus Tutoring"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Macroeconomics Tutoring"
        }
      }
    ]
  }
}
</script>
{{- end }}

{{- if $isPost }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title }},
  "description": {{ .Description | default .Site.Params.description }},
  "author": {
    "@type": "Person",
    "name": {{ $author }},
    "url": {{ .Site.BaseURL }}
  },
  "publisher": {
    "@type": "Person",
    "name": {{ $author }}
  },
  "url": {{ .Permalink }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" }}{{ with .Lastmod }},
  "dateModified": {{ .Format "2006-01-02T15:04:05Z07:00" }}{{ end }},
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink }}
  }{{ with .Params.tags }},
  "keywords": {{ delimit . ", " }}{{ end }}{{ with .Params.cover }},
  "image": {{ . }}{{ else }},
  "image": "{{ .Site.BaseURL }}images/og-image.png"{{ end }}
}
</script>
{{- end }}

{{- if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ .Site.BaseURL }}
    }{{ if $isPost }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Blog",
      "item": "{{ .Site.BaseURL }}posts/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ .Title }},
      "item": {{ .Permalink }}
    }{{ else if eq .Section "projects" }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "Projects",
      "item": {{ .Permalink }}
    }{{ else if eq .RelPermalink "/about/" }},
    {
      "@type": "ListItem",
      "position": 2,
      "name": "About",
      "item": {{ .Permalink }}
    }{{ end }}
  ]
}
</script>
{{- end }}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title }},
  "url": {{ .Site.BaseURL }},
  "author": {
    "@type": "Person",
    "name": {{ $author }}
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ .Site.BaseURL }}posts/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
