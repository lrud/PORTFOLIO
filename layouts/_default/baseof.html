<!DOCTYPE html>
<html lang="en">
<head>
    {{ partial "head.html" . }}
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="stylesheet" href="/css/custom.css">
    <link rel="stylesheet" href="/css/mobile.css">
    <style>
        html {
          background-color: var(--bg-primary) !important;
          transition: background-color 0.3s ease;
        }
        body { 
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
          background-color: var(--bg-primary) !important;
          color: var(--text-primary) !important;
          transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        nav {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .nav-bubble {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 0.5rem 0.75rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        [data-theme="light"] .nav-bubble {
            background: rgba(0, 0, 0, 0.03);
            border-color: rgba(0, 0, 0, 0.08);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        .nav-link {
            color: var(--text-secondary) !important;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 1.5rem;
            transition: all 0.2s ease;
        }
        
        .nav-link:hover {
            color: var(--text-primary) !important;
            background: rgba(255, 255, 255, 0.1);
        }
        
        [data-theme="light"] .nav-link:hover {
            background: rgba(0, 0, 0, 0.05);
        }
        
        nav .nav-bubble .nav-link.active {
            color: #ffffff !important;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9) 0%, rgba(37, 99, 235, 0.95) 100%);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
    </style>
    {{ partial "schema.html" . }}
    {{ partial "analytics.html" . }}
</head>
<body class="min-h-screen">
    <nav style="position: sticky; top: 0; z-index: 50; padding: 1rem 0;">
        <div style="max-width: 1200px; margin: 0 auto; padding: 0 1rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; height: 2.5rem;">
                <!-- Logo/Name -->
                <div style="display: flex; align-items: center;">
                    <a href="/" style="font-size: 1.125rem; font-weight: 700; color: var(--text-primary); text-decoration: none;">LR</a>
                </div>
                
                <!-- Desktop Navigation -->
                <div class="nav-bubble desktop-nav">
                    <a href="/about/" class="nav-link {{ if eq .RelPermalink "/about/" }}active{{ end }}">About</a>
                    <a href="/projects/" class="nav-link {{ if hasPrefix .RelPermalink "/projects" }}active{{ end }}">Projects</a>
                </div>
                
                <!-- Right side: Theme toggle + Mobile menu -->
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    {{ partial "theme-toggle.html" . }}
                    {{ partial "mobile-nav.html" . }}
                </div>
            </div>
        </div>
    </nav>
    
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    
    <footer style="background: var(--bg-secondary); padding: 1.25rem 0; margin-top: 2rem; border-top: 1px solid var(--border); position: relative;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);"></div>
        <div style="max-width: 1200px; margin: 0 auto; padding: 0 1rem; text-align: center;">
            <p style="margin: 0; font-size: 0.8rem; color: var(--text-muted);">&copy; {{ now.Year }} Lukas Rueda</p>
            <div style="margin-top: 0.5rem; display: flex; justify-content: center; gap: 1.25rem; font-size: 0.75rem;">
                {{ range .Site.Params.social }}
                  <a href="{{ .url }}" target="_blank" rel="noopener" style="color: var(--text-muted); text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">{{ title .name }}</a>
                {{ end }}
            </div>
        </div>
    </footer>
    
    <!-- Mobile nav overlay -->
    <div id="mobile-nav-overlay" class="mobile-nav-overlay"></div>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        if (!toggle) return;
        
        function setTheme(theme) {
            if (theme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }
            localStorage.setItem('theme', theme);
        }
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            }
        }
        
        toggle.addEventListener('click', function() {
            const isDark = html.hasAttribute('data-theme');
            const newTheme = isDark ? 'light' : 'dark';
            setTheme(newTheme);
        });
        
        initTheme();
    });
    </script>
</body>
</html>
