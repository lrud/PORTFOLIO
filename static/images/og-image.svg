<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#gradient)"/>
  
  <!-- Accent line -->
  <rect x="0" y="0" width="8" height="630" fill="#3b82f6"/>
  
  <!-- Name -->
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="#f1f5f9">
    Lukas Rueda
  </text>
  
  <!-- Title -->
  <text x="80" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="500" fill="#94a3b8">
    Quantitative Economist &amp; Risk Analyst
  </text>
  
  <!-- Subtitle -->
  <text x="80" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#64748b">
    Financial Econometrics • Time-Series Analysis • Volatility Forecasting
  </text>
  
  <!-- Bottom bar -->
  <rect x="80" y="500" width="300" height="4" fill="#3b82f6" rx="2"/>
  
  <!-- Domain -->
  <text x="80" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" fill="#64748b">
    principles0s.com
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1050" cy="150" r="80" fill="#1e293b" opacity="0.5"/>
  <circle cx="1100" cy="200" r="60" fill="#334155" opacity="0.3"/>
  
  <!-- Chart-like decoration -->
  <g transform="translate(850, 350)">
    <rect x="0" y="100" width="20" height="80" fill="#3b82f6" opacity="0.6" rx="2"/>
    <rect x="30" y="60" width="20" height="120" fill="#3b82f6" opacity="0.7" rx="2"/>
    <rect x="60" y="80" width="20" height="100" fill="#3b82f6" opacity="0.8" rx="2"/>
    <rect x="90" y="40" width="20" height="140" fill="#3b82f6" opacity="0.9" rx="2"/>
    <rect x="120" y="20" width="20" height="160" fill="#3b82f6" rx="2"/>
    <rect x="150" y="50" width="20" height="130" fill="#10b981" rx="2"/>
  </g>
</svg>
